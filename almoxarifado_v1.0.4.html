<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Controle do Almoxarifado de Química</title>

  <style>
    :root {
      --bg: #f3f6f5;
      --panel: #fff;
      --ink: #17231f;
      --soft: #5d6d66;
      --line: #dce5e1;
      --accent: #176b55;
      --accent2: #0e493b;
      --pale: #e5f2ed;
      --warn: #a85a19;
      --warnbg: #fff1df;
      --danger: #a02f28;
      --dangerbg: #fce9e7;
      --blue: #315a9b;
      --shadow: 0 10px 28px rgba(26, 56, 46, .08);
      --sans: Inter, "Segoe UI", Arial, sans-serif;
      --mono: "Cascadia Code", Consolas, monospace;
    }

    * {
      box-sizing: border-box;
    }

    html {
      font-size: 16px;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 1rem/1.45 var(--sans);
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 248px minmax(0, 1fr);
    }

    aside {
      position: sticky;
      top: 0;
      height: 100vh;
      background: #fff;
      color: var(--ink);
      border-right: 1px solid var(--line);
      box-shadow: 2px 0 16px rgba(23, 45, 37, .04);
      padding: 24px 16px 14px;
      display: flex;
      flex-direction: column;
    }

    .brand {
      padding: 0 10px 22px;
      border-bottom: 1px solid var(--line);
    }

    .brand strong {
      display: block;
      font-size: 1.06rem;
    }

    .brand span {
      display: block;
      color: var(--soft);
      font-size: .8rem;
      margin-top: 4px;
    }

    nav {
      min-height: 0;
      overflow: auto;
    }

    .nav-group {
      margin-top: 20px;
    }

    .nav-label {
      padding: 0 5px 7px;
      color: #7d8984;
      font-size: .7rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      font-weight: 700;
    }

    .nav-btn {
      width: 100%;
      border: 0;
      background: transparent;
      color: #53615c;
      padding: 10px 12px 10px 30px;
      border-radius: 8px;
      text-align: left;
      font-size: .88rem;
      margin: 2px 0;
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-btn::before {
      content: '';
      position: absolute;
      left: 13px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #a6afab;
    }

    .nav-btn:hover {
      background: #f5f8f7;
      color: #26342f;
    }

    .nav-btn.active {
      background: #dfeee9;
      color: #176b55;
      font-weight: 750;
      box-shadow: inset 0 0 0 1px #c8ddd6;
    }

    .nav-btn.active::before {
      background: #67ad98;
    }

    .nav-shortcut {
      margin-left: auto;
      font-size: .66rem;
      color: #8b9792;
      font-weight: 600;
    }

    .side-fixed {
      margin-top: auto;
      padding-top: 10px;
      border-top: 1px solid var(--line);
    }

    .side-fixed .nav-btn {
      color: #53615c;
    }

    .side-fixed .nav-btn::before {
      display: none;
    }

    .side-version {
      color: #8b9792;
      font-size: .72rem;
      padding: 8px 11px 0;
    }

    main {
      min-width: 0;
      padding: 30px 34px 60px;
    }

    .page-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    .page-head h1 {
      font-size: 1.5rem;
      line-height: 1.2;
      margin: 0 0 5px;
    }

    .page-head p {
      margin: 0;
      color: var(--soft);
      font-size: .88rem;
    }

    .head-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .card,
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: var(--shadow);
    }

    .card {
      padding: 18px;
    }

    .card b {
      display: block;
      font-size: 1.65rem;
      line-height: 1.1;
    }

    .card span {
      display: block;
      color: var(--soft);
      font-size: .78rem;
      margin-top: 7px;
    }

    .card.highlight {
      background: var(--pale);
      border-color: #bcd9cf;
    }

    .panel {
      padding: 20px;
      margin-bottom: 18px;
      min-width: 0;
      overflow: hidden;
    }

    .panel-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .panel h2 {
      font-size: 1rem;
      margin: 0;
    }

    .panel h3 {
      font-size: .9rem;
      margin: 18px 0 7px;
    }

    /* Espaçamento adicional somente nos títulos dos relatórios */
    #reportPrintArea .panel > h2 {
      margin-bottom: 14px;
    }

    .hint {
      font-size: .8rem;
      color: var(--soft);
    }

    .btn {
      border: 1px solid var(--accent);
      background: var(--accent);
      color: white;
      padding: 9px 14px;
      border-radius: 8px;
      font-size: .84rem;
      font-weight: 700;
    }

    .btn:hover {
      background: var(--accent2);
    }

    .btn.secondary {
      background: white;
      color: var(--accent);
    }

    .btn.secondary:hover {
      background: var(--pale);
    }

    .btn.danger {
      background: white;
      color: var(--danger);
      border-color: #e0aaa5;
    }

    .btn.danger:hover {
      background: var(--dangerbg);
    }

    .btn.small {
      padding: 6px 10px;
      font-size: .76rem;
    }

    .btn:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .toolbar {
      display: flex;
      align-items: end;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .toolbar .field {
      min-width: 180px;
      flex: 1;
    }

    .toolbar .field.compact {
      max-width: 190px;
      flex: 0 1 190px;
    }

    .field {
      min-width: 0;
    }

    .field label {
      display: block;
      color: var(--soft);
      font-size: .78rem;
      font-weight: 650;
      margin: 0 0 5px;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      border: 1px solid #cfdad5;
      background: #fbfcfc;
      color: var(--ink);
      padding: 9px 10px;
      border-radius: 8px;
      min-height: 41px;
    }

    .field textarea {
      min-height: 84px;
      resize: vertical;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      outline: 3px solid rgba(23, 107, 85, .12);
      border-color: var(--accent);
      background: #fff;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(150px, 1fr));
      gap: 14px;
    }

    .span-2 {
      grid-column: span 2;
    }

    .span-4 {
      grid-column: 1 / -1;
    }

    .form-note {
      background: #f6faf8;
      border: 1px dashed #bfd5cd;
      border-radius: 9px;
      padding: 11px 13px;
      color: var(--soft);
      font-size: .8rem;
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 9px;
      margin-top: 18px;
    }

    .stock-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .stock-tab {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--soft);
      border-radius: 8px;
      padding: 8px 12px;
      font-weight: 700;
    }

    .stock-tab.active {
      background: var(--pale);
      border-color: #bcd9cf;
      color: var(--accent);
    }

    .table-wrap {
      overflow-x: auto;
      overflow-y: clip;
      border: 1px solid var(--line);
      border-radius: 9px;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      scrollbar-gutter: stable;
      overscroll-behavior-x: contain;
      overscroll-behavior-y: auto;
    }

    .table-wrap.tall {
      overflow-y: auto;
      overscroll-behavior-y: contain;
    }

    .table-wrap th:last-child,
    .table-wrap td:last-child {
      padding-right: 14px;
    }

    .table-wrap.tall {
      max-height: 60vh;
    }

    .table-wrap.tall thead th:last-child {
      padding-right: 18px;
    }

    table {
      width: 100%;
      min-width: 0;
      border-collapse: separate;
      border-spacing: 0;
      font-size: .82rem;
    }

    .table-wrap.wide table {
      min-width: 1080px;
    }

    .table-wrap.extra-wide table {
      min-width: 1260px;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #eef3f1;
      color: #43554e;
      font-size: .73rem;
      line-height: 1.2;
      text-align: left;
      padding: 10px 9px;
      border-bottom: 1px solid #cad7d2;
      white-space: nowrap;
    }

    td {
      padding: 9px;
      border-bottom: 1px solid #edf1ef;
      vertical-align: top;
      line-height: 1.3;
    }

    tbody tr:last-child td {
      border-bottom: 0;
    }

    tbody tr:hover td {
      background: #f8fbfa;
    }

    .col-select {
      width: 86px;
      min-width: 86px;
    }

    .col-code {
      width: 100px;
      min-width: 90px;
    }

    .col-sub {
      width: 76px;
      min-width: 68px;
      text-align: center;
    }

    .col-name {
      min-width: 170px;
      max-width: 270px;
    }

    .col-formula {
      min-width: 110px;
      max-width: 160px;
    }

    .col-number {
      width: 112px;
      min-width: 100px;
    }

    .col-date {
      width: 112px;
      min-width: 102px;
    }

    .col-person {
      min-width: 135px;
      max-width: 210px;
    }

    .col-lab {
      min-width: 120px;
      max-width: 180px;
    }

    .col-status {
      min-width: 145px;
      max-width: 220px;
    }

    .col-obs {
      min-width: 130px;
      max-width: 230px;
    }

    .col-actions {
      width: 135px;
      min-width: 125px;
    }

    .num {
      text-align: right;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    /* Alinhamento consistente entre títulos e valores das tabelas */
    th.col-number {
      text-align: right;
    }

    th.col-sub,
    td.col-sub {
      text-align: center;
    }

    th.col-status,
    td.col-status {
      text-align: center;
    }

    /* Cadastrar/Gerenciar */
    #bottleTable th:nth-child(5),
    #bottleTable th:nth-child(6),
    #bottleTable th:nth-child(8),
    #bottleTable th:nth-child(9),
    #bottleTable th:nth-child(10),
    #bottleTable td:nth-child(5),
    #bottleTable td:nth-child(6),
    #bottleTable td:nth-child(8),
    #bottleTable td:nth-child(9),
    #bottleTable td:nth-child(10) {
      text-align: right;
    }

    #bottleTable th:nth-child(7),
    #bottleTable td:nth-child(7),
    #bottleTable th:nth-child(11),
    #bottleTable td:nth-child(11),
    #bottleTable th:nth-child(13),
    #bottleTable td:nth-child(13) {
      text-align: center;
    }

    #bottleTable td:nth-child(13) .actions {
      justify-content: center;
    }

    /* Busca de reagentes */
    .reagent-search th:nth-child(4),
    .reagent-search td:nth-child(4) {
      text-align: center;
    }

    .reagent-search th:nth-child(5),
    .reagent-search td:nth-child(5) {
      text-align: right;
    }

    /* Retirar e Devolver */
    .movement-picker th.col-number,
    .movement-picker td.num {
      text-align: right;
    }

    .movement-picker th.col-sub,
    .movement-picker td.col-sub {
      text-align: center;
    }

    .movement-picker .table-action-cell {
      text-align: center;
    }

    .code {
      font-family: var(--mono);
      font-size: .77rem;
      white-space: nowrap;
    }

    .nowrap {
      white-space: nowrap;
    }

    .obs {
      white-space: normal;
      overflow-wrap: anywhere;
      color: #3e4d47;
    }

    .muted {
      color: var(--soft);
    }

    .actions {
      display: flex;
      gap: 6px;
      white-space: nowrap;
    }

    .badge {
      display: inline-block;
      border-radius: 999px;
      padding: 3px 8px;
      font-size: .7rem;
      font-weight: 750;
      white-space: normal;
    }

    .ok {
      background: var(--pale);
      color: var(--accent);
    }

    .open {
      background: #e7eef9;
      color: var(--blue);
    }

    .low {
      background: var(--warnbg);
      color: var(--warn);
    }

    .danger-tag {
      background: var(--dangerbg);
      color: var(--danger);
    }

    .retirada {
      background: var(--dangerbg);
      color: var(--danger);
    }

    .devolucao {
      background: var(--pale);
      color: var(--accent);
    }

    .empty {
      padding: 34px;
      text-align: center;
      color: var(--soft);
    }

    .select-row {
      display: flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
    }

    .select-row input {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
    }

    .cart-card {
      background: #f7faf9;
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 12px;
      margin: 9px 0;
    }

    .cart-card strong {
      display: block;
      margin-bottom: 8px;
    }

    .cart-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .notice {
      border: 1px solid #e8c79f;
      background: var(--warnbg);
      color: #77400f;
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 18px;
      font-size: .84rem;
    }

    .toast {
      position: fixed;
      right: 24px;
      bottom: 24px;
      background: #122d25;
      color: #fff;
      padding: 12px 16px;
      border-radius: 9px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, .2);
      opacity: 0;
      transform: translateY(10px);
      transition: .2s;
      pointer-events: none;
      z-index: 50;
    }

    .toast.show {
      opacity: 1;
      transform: none;
    }

    .toast.error {
      background: var(--danger);
    }

    dialog {
      border: 0;
      border-radius: 12px;
      padding: 0;
      max-width: 860px;
      width: calc(100% - 32px);
      box-shadow: 0 24px 70px rgba(0, 0, 0, .28);
    }

    dialog::backdrop {
      background: rgba(10, 28, 23, .55);
    }

    .dialog-body {
      padding: 22px;
    }

    .dialog-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .dialog-head h2 {
      margin: 0;
      font-size: 1.05rem;
    }

    .icon-close {
      border: 0;
      background: #edf2f0;
      border-radius: 7px;
      padding: 5px 9px;
    }

    .mono-block,
    .code-block {
      font: 12px/1.55 var(--mono);
      white-space: pre;
      background: #f2f5f4;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 13px;
      overflow: auto;
    }

    .danger-zone {
      border-color: #efc5c1;
      background: #fffafa;
    }

    /* Visual anterior das configurações */
    .config-tabs {
      display: flex;
      gap: 8px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 20px;
    }

    .config-tab-btn {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 8px 14px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--soft);
      cursor: pointer;
      transition: all .18s ease;
      font-family: var(--sans);
    }

    .config-tab-btn:hover {
      color: var(--ink);
    }

    .config-tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .formula {
      font-family: var(--mono);
      white-space: nowrap;
    }

    .formula sub {
      font-size: .72em;
      vertical-align: sub;
      line-height: 0;
    }

    .formula-preview {
      min-height: 42px;
      border: 1px solid #cfdad5;
      background: #fbfcfc;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 1rem;
      display: flex;
      align-items: center;
    }

    .formula-preview.empty {
      color: var(--soft);
      font-family: var(--sans);
      justify-content: flex-start;
    }

    .calc-live {
      background: #eef7f4;
      border: 1px solid #c8ddd6;
      border-radius: 9px;
      padding: 12px 14px;
      font-size: .86rem;
    }

    .calc-live strong {
      font-size: 1rem;
      color: var(--accent);
    }

    .hidden-field {
      display: none !important;
    }

    .macro-note {
      font-size: .75rem;
      color: var(--soft);
      margin-left: 6px;
    }

    /* Carregamento progressivo das listas */
    .loading-box {
      min-height: 130px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--soft);
      font-size: .84rem;
    }

    .loading-inline {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 10px 4px 12px;
      color: var(--soft);
      font-size: .8rem;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid #d4ded9;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      flex: 0 0 auto;
    }

    .spinner.small {
      width: 16px;
      height: 16px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }





    .bar-row {
      display: grid;
      grid-template-columns: minmax(240px, 320px) minmax(180px, 1fr) 120px;
      gap: 14px;
      align-items: center;
      margin: 12px 0;
    }

    .bar-label {
      font-size: .8rem;
      line-height: 1.45;
    }

    .bar-track {
      height: 10px;
      background: #edf2f0;
      border-radius: 999px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 999px;
    }

    .bar-value {
      text-align: right;
      font-size: .8rem;
      font-weight: 700;
      white-space: nowrap;
    }

    /* Ajustes v9.3 */
    .side-fixed .nav-btn {
      padding-left: 12px;
      justify-content: flex-start;
      gap: 9px;
    }

    .config-icon {
      width: 18px;
      flex: 0 0 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .config-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .config-actions .btn {
      margin: 0;
    }

    .license-text {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: normal;
      overflow-x: hidden;
      max-width: 100%;
    }

    .formula-editor {
      width: 100%;
      min-height: 41px;
      border: 1px solid #cfdad5;
      background: #fbfcfc;
      color: var(--ink);
      padding: 9px 10px;
      border-radius: 8px;
      outline: none;
      font-family: var(--mono);
      cursor: text;
    }

    .formula-editor:focus {
      outline: 3px solid rgba(23, 107, 85, .12);
      border-color: var(--accent);
      background: #fff;
    }

    .formula-editor:empty::before {
      content: attr(data-placeholder);
      color: #8b9792;
      pointer-events: none;
    }

    .formula-editor sub {
      font-size: .72em;
      vertical-align: sub;
      line-height: 0;
    }

    .config-panel-copy {
      max-width: 1000px;
      line-height: 1.6;
    }

    .cart-card-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
    }

    .cart-card-main {
      flex: 1 1 auto;
      min-width: 0;
    }

    .cart-remove {
      flex: 0 0 auto;
      margin-top: 0;
    }

    .table-action-cell {
      text-align: right;
      white-space: nowrap;
    }

    /* Ajuste de largura das listas de seleção de Retirar e Devolver */
    .table-wrap.movement-picker table {
      width: 100%;
      min-width: 900px;
      table-layout: auto;
    }

    .movement-picker th,
    .movement-picker td {

<body>
  <div class="app">
    <aside>
      <div class="brand">
        <strong>Almoxarifado</strong>
        <span>Lab de Química · UNISC</span>
      </div>

      <nav id="nav"></nav>

      <div class="side-fixed">
        <button id="configButton" class="nav-btn" onclick="go('config')"><span class="config-icon">⚙</span><span>Configurações</span></button>
        <div class="side-version">Versão 1.0.4</div>
      </div>
    </aside>

    <main id="main"></main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <dialog id="editDialog">
    <div id="editDialogBody" class="dialog-body"></div>
  </dialog>

  <input id="backupInput" type="file" accept="application/json,.json" hidden>

  <script>
    const APP_VERSION = '1.0.4';
    const DB_KEY = 'almoxarifado_v8_1';
    const PIN_KEY = 'almoxarifado_pin';

    const EMPTY_STATE = {
      version: APP_VERSION,
      bottles: [],
      movements: [],
      logs: [],
      sourceFile: null,
      lastBackup: null
    };

    const NAV = [
      { group: 'VISÃO GERAL', id: 'dashboard', label: 'Painel', shortcut: '' },
      { group: 'ESTOQUE E MOVIMENTAÇÕES', id: 'estoque', label: 'Consultar', shortcut: 'Alt+E' },
      { group: 'ESTOQUE E MOVIMENTAÇÕES', id: 'retirada', label: 'Retirar', shortcut: 'Alt+R' },
      { group: 'ESTOQUE E MOVIMENTAÇÕES', id: 'devolucao', label: 'Devolver', shortcut: 'Alt+D' },
      { group: 'ESTOQUE E MOVIMENTAÇÕES', id: 'cadastro', label: 'Cadastrar/Gerenciar', shortcut: 'Alt+K' },
      { group: 'CONSULTAS', id: 'historico', label: 'Histórico', shortcut: 'Alt+H' },
      { group: 'CONSULTAS', id: 'relatorios', label: 'Relatórios', shortcut: 'Alt+P' }
    ];

    let currentPage = 'dashboard';
    let currentConfigTab = 'geral';
    let currentStockPF = false;
    let withdrawCart = [];
    let returnCart = [];

    let withdrawDraft = {
      laboratorio: '',
      disciplina: '',
      diversos: '',
      complemento: '',
      responsavel: '',
      pfDisciplina: '',
      pfDiversos: '',
      pfComplemento: ''
    };

    const returnDraft = {};
    let returnPersonDraft = '';
    const listRenderTokens = new Map();

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function normalizeState(data) {
      const regular = Array.isArray(data?.bottles) ? data.bottles : [];
      const legacyPF = Array.isArray(data?.pfBottles) ? data.pfBottles : [];

      const merged = [...regular, ...legacyPF].filter((bottle, index, array) => {
        return array.findIndex(other => {
          if (other.id && bottle.id) {
            return other.id === bottle.id;
          }

          return norm(other.codigo) === norm(bottle.codigo)
            && norm(other.subcodigo) === norm(bottle.subcodigo);
        }) === index;
      });

      const movements = (Array.isArray(data?.movements) ? data.movements : []).map(movement => {
        const status = norm(movement.status);

        return {
          ...movement,
          status: status === 'fechado'
            ? 'devolvido'
            : (movement.status || (movement.dataDevolucao ? 'devolvido' : 'aberto')),
          observacaoDevolucao: movement.observacaoDevolucao || ''
        };
      });

      const logs = (Array.isArray(data?.logs) ? data.logs : []).map(item => ({
        id: item.id || uid('log'),
        type: item.type || item.tipo || 'registro',
        description: item.description || item.descricao || '',
        date: item.date || item.data || new Date().toISOString()
      }));

      return {
        version: APP_VERSION,
        bottles: merged,
        movements,
        logs,
        sourceFile: data?.sourceFile || null,
        lastBackup: data?.lastBackup || null
      };
    }

    function load() {
      try {
        const raw = localStorage.getItem(DB_KEY);
        if (raw) {
          return normalizeState(JSON.parse(raw));
        }
      } catch (error) {
        console.error('Falha ao carregar os dados locais:', error);
      }

      return clone(EMPTY_STATE);
    }

    let state = load();

    function save() {
      state.version = APP_VERSION;
      localStorage.setItem(DB_KEY, JSON.stringify(state));
    }

    function uid(prefix) {
      return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`;
    }

    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[char]));
    }

    function norm(value) {
      return String(value ?? '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
        .trim();
    }

    function n(value) {
      const parsed = Number(String(value ?? '').replace(',', '.'));
      return Number.isFinite(parsed) ? parsed : 0;
    }

    function fmt(value, decimals = 2) {
      if (value === null || value === undefined || value === '') {
        return '—';
      }

      return Number(value).toLocaleString('pt-BR', {
        maximumFractionDigits: decimals
      });
    }

    function dateOnly(value) {
      if (!value) return '—';

      const date = new Date(value);
      return Number.isNaN(date.getTime())
        ? '—'
        : date.toLocaleDateString('pt-BR');
    }

    function dateTime(value) {
      if (!value) return '—';

      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '—';

      const datePart = date.toLocaleDateString('pt-BR');
      const timePart = date.toLocaleTimeString('pt-BR');
      return `${datePart} ${timePart}`;
    }

    function dateTimestamp(value) {
      if (!value) return 0;

      const direct = new Date(value);
      if (!Number.isNaN(direct.getTime())) {
        return direct.getTime();
      }

      const text = String(value).trim();
      const match = text.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:[ ,]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?$/);
      if (!match) return 0;

      const [, day, month, year, hour = '0', minute = '0', second = '0'] = match;
      const parsed = new Date(Number(year), Number(month) - 1, Number(day), Number(hour), Number(minute), Number(second));
      return Number.isNaN(parsed.getTime()) ? 0 : parsed.getTime();
    }

    function localDateKey(value) {
      if (!value) return '';

      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '';

      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function todayInput() {
      const date = new Date();
      return new Date(date.getTime() - date.getTimezoneOffset() * 60000)
        .toISOString()
        .slice(0, 10);
    }

    function fileSize(bytes) {
      if (!Number.isFinite(bytes)) return 'não informado';
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1048576) return `${(bytes / 1024).toFixed(1)} KB`;
      return `${(bytes / 1048576).toFixed(1)} MB`;
    }

    function obs(value) {
      return value
        ? `<span class="obs">${esc(value)}</span>`
        : '<span class="muted">—</span>';
    }

    function chem(value) {
      const safe = esc(value || '');

      if (!safe) {
        return '<span class="muted">—</span>';
      }

      return `<span class="formula">${safe.replace(/(\d+)/g, '<sub>$1</sub>')}</span>`;
    }

    function isTypingTarget(element) {
      return !!element && (
        ['INPUT', 'TEXTAREA', 'SELECT'].includes(element.tagName)
        || element.isContentEditable
      );
    }

    function handleShortcut(event) {
      if (isTypingTarget(event.target) || event.repeat) return;
      if (!event.altKey || event.ctrlKey || event.metaKey) return;

      const key = event.key.toLowerCase();
      const shortcuts = {
        e: 'estoque',
        r: 'retirada',
        d: 'devolucao',
        h: 'historico',
        p: 'relatorios'
      };

      if (key === 'k') {
        event.preventDefault();
        go('cadastro');
        requestAnimationFrame(() => openBottleDialog());
        return;
      }

      if (!shortcuts[key]) return;

      event.preventDefault();
      go(shortcuts[key]);
    }

    function toast(message, error = false) {
      const element = document.getElementById('toast');
      element.textContent = message;
      element.className = `toast show${error ? ' error' : ''}`;

      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => {
        element.className = 'toast';
      }, 2800);
    }

    function log(type, description) {
      state.logs.unshift({
        id: uid('log'),
        type,
        description,
        date: new Date().toISOString()
      });

      save();
    }

    function header(title, subtitle, actions = '') {
      return `
        <div class="page-head">
          <div>
            <h1>${title}</h1>
            <p>${subtitle}</p>
          </div>
          ${actions ? `<div class="head-actions">${actions}</div>` : ''}
        </div>
      `;
    }

    function unitForBottle(bottle) {
      return bottle?.tipo === 'L' ? 'ml' : 'g';
    }

    function displayQuantity(value, unit) {
      if (value === null || value === undefined || value === '') return '—';

      const normalizedUnit = norm(unit);

      if (normalizedUnit === 'ml' || normalizedUnit === 'l') {
        return `${fmt(value)} ml`;
      }

      return `${fmt(value)} ${unit || 'g'}`;
    }

    function displayBottleContent(bottle) {
      return bottle?.tipo === 'L'
        ? `${fmt(bottle?.conteudo)} ml`
        : `${fmt(bottle?.conteudo)} g`;
    }


    function displayWeight(value) {
      if (value === null || value === undefined || value === '') return '—';
      return `${fmt(value)} g`;
    }

    function isPFCode(code) {
      return norm(code).startsWith('pf');
    }

    function activeBottles() {
      return state.bottles.filter(bottle => !bottle.baixado);
    }

    function openMovementForBottle(id) {
      return state.movements.find(movement => (
        movement.bottleId === id && movement.status === 'aberto'
      )) || null;
    }

    function isOpen(id) {
      return !!openMovementForBottle(id);
    }

    function currentBottle(movement) {
      return state.bottles.find(bottle => bottle.id === movement.bottleId);
    }

    function byCode(a, b) {
      return String(a.codigo || '').localeCompare(
        String(b.codigo || ''),
        'pt-BR',
        { numeric: true, sensitivity: 'base' }
      ) || String(a.subcodigo || '').localeCompare(
        String(b.subcodigo || ''),
        'pt-BR',
        { numeric: true, sensitivity: 'base' }
      );
    }

    function daysSinceBackup() {
      if (!state.lastBackup) return null;

      const date = new Date(state.lastBackup);
      if (Number.isNaN(date.getTime())) return null;

      return Math.floor((Date.now() - date.getTime()) / 86400000);
    }

    function formatInt(value) {
      return Number(value || 0).toLocaleString('pt-BR');
    }

    function verifyPin() {
      const pin = localStorage.getItem(PIN_KEY);
      if (!pin) return true;

      const typed = prompt('Digite o PIN de segurança:');
      if (typed === null) return false;

      if (typed !== pin) {
        toast('PIN incorreto.', true);
        return false;
      }

      return true;
    }

    function renderNav() {
      const groups = [...new Set(NAV.map(item => item.group))];
      const nav = document.getElementById('nav');

      nav.innerHTML = groups.map(group => `
        <div class="nav-group">
          <div class="nav-label">${group}</div>
          ${NAV
            .filter(item => item.group === group)
            .map(item => `
              <button
                class="nav-btn ${currentPage === item.id ? 'active' : ''}"
                onclick="go('${item.id}')"
                title="${item.shortcut ? `Atalho: ${item.shortcut}` : ''}"
              >
                <span>${item.label}</span>
                ${item.shortcut ? `<span class="nav-shortcut">${item.shortcut}</span>` : ''}
              </button>
            `)
            .join('')}
        </div>
      `).join('');

      document
        .getElementById('configButton')
        .classList
        .toggle('active', currentPage === 'config');
    }

    function resetMovementDrafts() {
      withdrawCart = [];
      returnCart = [];
      withdrawDraft = {
        laboratorio: '',
        disciplina: '',
        diversos: '',
        complemento: '',
        responsavel: '',
        pfDisciplina: '',
        pfDiversos: '',
        pfComplemento: ''
      };

      Object.keys(returnDraft).forEach(key => {
        delete returnDraft[key];
      });

      returnPersonDraft = '';
    }

    function go(page) {
      currentPage = page;
      resetMovementDrafts();
      renderNav();
      render();
      window.scrollTo(0, 0);
    }

    function render() {
      const main = document.getElementById('main');

      const routes = {
        dashboard: renderDashboard,
        estoque: () => renderStock(main, currentStockPF),
        cadastro: renderBottles,
        retirada: renderWithdrawal,
        devolucao: renderReturn,
        historico: renderHistory,
        relatorios: renderReports,
        config: renderConfig
      };

      (routes[currentPage] || renderDashboard)(main);
    }

    function loadingMarkup(text = 'Carregando lista...') {
      return `
        <div class="loading-box">
          <span class="spinner"></span>
          <span>${text}</span>
        </div>
      `;
    }

    function renderAsyncTable({
      target,
      rows,
      tableClass = '',
      headerHtml,
      rowRenderer,
      emptyMessage,
      batchSize = 100
    }) {
      if (!target) return;

      const key = target.id || uid('list');
      const token = (listRenderTokens.get(key) || 0) + 1;
      listRenderTokens.set(key, token);

      target.innerHTML = loadingMarkup();

      requestAnimationFrame(() => {
        if (listRenderTokens.get(key) !== token) return;

        if (!rows.length) {
          target.innerHTML = `<div class="empty">${emptyMessage}</div>`;
          return;
        }

        target.innerHTML = `
          <div class="loading-inline" id="${key}_loading">
            <span class="spinner small"></span>
            <span>Carregando ${rows.length.toLocaleString('pt-BR')} item(ns)...</span>
          </div>
          <div class="table-wrap ${tableClass}">
            <table>
              <thead>${headerHtml}</thead>
              <tbody></tbody>
            </table>
          </div>
        `;

        const body = target.querySelector('tbody');
        const loading = target.querySelector(`#${CSS.escape(key)}_loading`);
        let index = 0;

        function appendBatch() {
          if (listRenderTokens.get(key) !== token) return;

          const end = Math.min(index + batchSize, rows.length);
          let html = '';

          for (; index < end; index++) {
            html += rowRenderer(rows[index], index);
          }

          body.insertAdjacentHTML('beforeend', html);

          if (index < rows.length) {
            requestAnimationFrame(appendBatch);
          } else if (loading) {
            loading.remove();
          }
        }

        appendBatch();
      });
    }

    function inventory(isPF = null) {
      const map = new Map();

      activeBottles()
        .filter(bottle => isPF === null || isPFCode(bottle.codigo) === isPF)
        .forEach(bottle => {
          const key = norm(bottle.codigo);
          const row = map.get(key) || {
            nome: bottle.nome,
            codigo: bottle.codigo,
            formula: bottle.formula,
            frascos: 0,
            noAlmox: 0,
            emUso: 0,
            unidade: unitForBottle(bottle)
          };

          row.frascos++;

          if (isOpen(bottle.id)) {
            row.emUso += n(bottle.conteudo);
          } else {
            row.noAlmox += n(bottle.conteudo);
          }

          map.set(key, row);
        });

      return [...map.values()].sort(byCode);
    }

              >

              <label>Nome do reagente *</label>
              <input
                name="nome"

                value="${esc(bottle.nome)}"

              <select
                name="tipo"
                onchange="toggleDensity(this.form); updateBottleLive(this.form, '${id}')"
              >
                <option value="S" ${bottle.tipo === 'S' ? 'selected' : ''}>Sólido</option>
                <option value="L" ${bottle.tipo === 'L' ? 'selected' : ''}>Líquido</option>

              >

    function toggleDensity(form) {
      const liquid = form.tipo.value === 'L';
      const box = form.querySelector('#densityField');
      const contentLabel = form.querySelector('#contentLabel');

      if (contentLabel) {
        contentLabel.textContent = `Conteúdo do frasco (${liquid ? 'ml' : 'g'}) *`;
      }

      if (box) {
        box.classList.toggle(
          'hidden-field',
          !liquid || form.dataset.inherited === '1'
        );
      }

      form.densidade.disabled = !liquid;
      form.densidade.required = liquid && form.dataset.inherited !== '1';
    }

    function setFormulaEditorValue(form, value) {
      const editor = form.querySelector('#formulaEditor');
      if (!editor) return;

      form.formula.value = value || '';
      editor.innerHTML = formulaEditorHtml(value || '');
    }

    function formulaEditorHtml(value) {
      return esc(value).replace(/(\d+)/g, '<sub>$1</sub>');
    }

    function formatFormulaEditor(editor, form) {
      const raw = editor.textContent.replace(/\s+/g, '').trim();
      form.formula.value = raw;
      editor.innerHTML = formulaEditorHtml(raw);

      const range = document.createRange();
      const selection = window.getSelection();
      range.selectNodeContents(editor);
      range.collapse(false);
      selection.removeAllRanges();
      selection.addRange(range);
    }

    function syncBottleCode(form, id = '') {
      const code = form.codigo.value.trim();
      const originalCode = form.dataset.originalCode || '';
      const codeChanged = !!id && norm(code) !== norm(originalCode);
      const match = state.bottles.find(bottle => (
        bottle.id !== id
        && !bottle.baixado
        && norm(bottle.codigo) === norm(code)
      ));

      form.dataset.inherited = match && (!id || codeChanged) ? '1' : '0';
      const inherited = form.dataset.inherited === '1';

      if (inherited) {
        form.nome.value = match.nome || '';
        setFormulaEditorValue(form, match.formula || '');
        form.tipo.value = match.tipo || 'S';
        form.densidade.value = match.densidade || '';
      }

      ['nameField', 'formulaField', 'typeField'].forEach(fieldId => {
        form.querySelector(`#${fieldId}`)?.classList.toggle('hidden-field', inherited);
      });

      toggleDensity(form);
      updateBottleLive(form, id);
    }

    function updateBottleLive(form) {
      const content = n(form.conteudo.value);
      const total = n(form.massaTotal.value);
      const type = form.tipo.value;
      const density = type === 'L' ? n(form.densidade.value) : 0;
      const real = type === 'L' ? content * density : content;
      const tare = total - real;
      const box = form.querySelector('#tareLive');

      if (!box) return;

      if (
        form.conteudo.value === ''
        || form.massaTotal.value === ''
        || (type === 'L' && density <= 0)
      ) {
        box.innerHTML = 'Preencha os valores necessários para calcular a tara em tempo real.';
        return;
      }

      box.innerHTML = `
        Massa real calculada: <strong>${fmt(real)} g</strong>
        &nbsp;·&nbsp;
        Tara do frasco: <strong>${fmt(tare)} g</strong>
      `;
    }

    function saveBottle(event, id) {
      event.preventDefault();

      if (id && isOpen(id)) {
        toast('Esse reagente está em uso — registre a devolução antes de editar.', true);
        return;
      }

      const form = event.target;
      const code = form.codigo.value.trim().toUpperCase();
      const subcode = form.subcodigo.value.trim();

      if (!subcode) {
        toast('Informe o subcódigo do frasco.', true);
        return;
      }

      if (!/^\d+$/.test(subcode)) {
        toast('O subcódigo deve conter apenas números.', true);
        return;
      }

      const duplicate = state.bottles.some(bottle => (
        bottle.id !== id
        && !bottle.baixado
        && norm(bottle.codigo) === norm(code)
        && norm(bottle.subcodigo) === norm(subcode)
      ));

      if (duplicate) {
        toast(`O código ${code} com subcódigo ${subcode} já está cadastrado.`, true);
        return;
      }

      const content = n(form.conteudo.value);
      const type = form.tipo.value;
      const density = type === 'L' ? n(form.densidade.value) : 0;
      const total = n(form.massaTotal.value);
      const real = type === 'L' ? content * density : content;
      const tare = total - real;

      if (!code || !form.nome.value.trim()) {
        toast('Informe código e nome do reagente.', true);
        return;
      }

      if (content < 0 || total < 0 || (type === 'L' && density <= 0)) {
        toast('Confira conteúdo, massa total e densidade.', true);
        return;
      }

      if (tare < 0 && !confirm('A tara calculada ficou negativa. Deseja salvar mesmo assim?')) {
        return;
      }

      const item = {
        id: id || uid('frasco'),
        nome: form.nome.value.trim(),
        codigo: code,
        subcodigo: subcode,
        formula: form.formula.value.trim(),
        conteudo: content,
        tara: tare,
        tipo: type,
        densidade: density,
        massaTotal: total,
        massaReal: real,
        observacao: form.observacao.value.trim(),
        baixado: false
      };

      if (id) {
        const index = state.bottles.findIndex(bottle => bottle.id === id);
        if (index < 0) return;

        item.baixado = !!state.bottles[index].baixado;
        state.bottles[index] = item;
        log('edição', `Frasco ${code}/${subcode} atualizado`);
      } else {
        state.bottles.push(item);
        log('cadastro', `Frasco ${code}/${subcode} cadastrado`);
      }

      save();
      document.getElementById('editDialog').close();
      toast(`Cadastro salvo. Tara: ${fmt(tare)} g.`);
      render();
    }

    function deleteBottle(id) {

    function returnCalc(movement, weight) {
      const bottle = currentBottle(movement);
      if (!bottle) return null;

      const real = weight - n(bottle.tara);

      // Alguns dados antigos/importados podem trazer a densidade como texto
      // (por exemplo "0,79"). Sempre normalizamos antes de calcular.
      // Se a densidade estiver ausente, tentamos recuperá-la pela relação
      // massa real / conteúdo já salva no cadastro do frasco.
      const savedDensity = n(bottle.densidade);
      const inferredDensity = n(bottle.conteudo) > 0 && n(bottle.massaReal) > 0
        ? n(bottle.massaReal) / n(bottle.conteudo)
        : 0;
      const density = savedDensity > 0 ? savedDensity : inferredDensity;

      const content = bottle.tipo === 'L'
        ? (density > 0 ? real / density : NaN)
        : real;
      const used = n(bottle.conteudo) - content;

      return {
        b: bottle,
        real,
        content,
        used,
        density
      };
    }

    function updateReturnDraft(id, value) {

      const movement = state.movements.find(item => item.id === id);

      const weight = n(returnDraft[id]?.peso);

      if (!movement || !box) return;

      if (returnDraft[id]?.peso === '') {
        box.textContent = 'Novo conteúdo: — · Quantidade gasta: —';
        return;
      }

      const calc = returnCalc(movement, weight);

      if (!calc || !Number.isFinite(calc.content)) {
        box.textContent = 'Não foi possível calcular.';
        return;
      }

      const quantityText = calc.used >= 0
        ? `Quantidade gasta: ${displayQuantity(calc.used, unitForBottle(calc.b))}`
        : `Quantidade adicionada: ${displayQuantity(Math.abs(calc.used), unitForBottle(calc.b))}`;

      box.textContent = `Novo conteúdo: ${displayBottleContent({ ...calc.b, conteudo: calc.content })} · ${quantityText}`;

    function saveReturns(event) {
      event.preventDefault();

      if (!returnCart.length) {

      if (!person) {

      const validated = [];

      for (const id of returnCart) {
        const movement = state.movements.find(item => item.id === id);
        const bottle = movement && currentBottle(movement);
        const draft = returnDraft[id] || {};

        if (!movement || !bottle) {
          toast('Um dos frascos não foi localizado.', true);
          return;
        }

        if (draft.peso === '') {
          toast(`Informe o peso de ${movement.codigo}/${movement.subcodigo}.`, true);
          return;
        }

        const weight = n(draft.peso);
        const calc = returnCalc(movement, weight);

        if (weight < n(bottle.tara)) {
          toast(`O peso de ${movement.codigo}/${movement.subcodigo} não pode ser menor que a tara (${fmt(bottle.tara)} g).`, true);
          return;
        }

        if (!calc || !Number.isFinite(calc.content)) {
          if (bottle.tipo === 'L' && n(bottle.densidade) <= 0 && calc?.density <= 0) {
            toast(`Não foi possível calcular ${movement.codigo}/${movement.subcodigo}: a densidade do líquido não está cadastrada.`, true);
          } else {
            toast(`Não foi possível calcular a devolução de ${movement.codigo}/${movement.subcodigo}.`, true);
          }
          return;
        }

        validated.push({
          movement,
          weight,
          calc,
          observacaoDevolucao: (draft.observacao || '').trim()
        });
      }

      const now = new Date().toISOString();

      validated.forEach(({ movement, weight, calc, observacaoDevolucao }) => {
        movement.dataDevolucao = now;
        movement.pesoDevolucao = weight;
        movement.quantidadeGasta = calc.used;
        movement.pessoaDevolveu = person;
        movement.observacaoDevolucao = observacaoDevolucao;
        movement.status = 'devolvido';

        calc.b.conteudo = calc.content;
        calc.b.massaReal = calc.real;
        calc.b.massaTotal = weight;
      });

      log('devolução', `${validated.length} devolução(ões) registrada(s) por ${person}`);
      toast(`${validated.length} devolução(ões) registrada(s) e estoque atualizado.`);
      go('dashboard');
    }

    function latestEvents() {
      const events = [];
      let sequence = 0;

      state.movements.forEach(movement => {
        if (movement.dataRetirada) {
          events.push({
            date: movement.dataRetirada,
            timestamp: dateTimestamp(movement.dataRetirada),
            sequence: sequence++,
            type: 'Retirada',
            m: movement,
            weight: `${displayWeight(movement.pesoRetirada)}`,
            responsible: movement.responsavel,
            returnedBy: ''
          });
        }

        if (movement.dataDevolucao) {
          events.push({
            date: movement.dataDevolucao,
            timestamp: dateTimestamp(movement.dataDevolucao),
            sequence: sequence++,
            type: 'Devolução',
            m: movement,
            weight: displayWeight(movement.pesoDevolucao),
            responsible: movement.responsavel || '—',
            returnedBy: movement.pessoaDevolveu || '—'
          });
        }
      });

      return events
        .sort((a, b) => (b.timestamp - a.timestamp) || (b.sequence - a.sequence))
        .slice(0, 50);
    }

    function consumptionRows() {
      const map = new Map();

      state.movements
        .filter(movement => (
          movement.status === 'devolvido'
          && Number.isFinite(Number(movement.quantidadeGasta))
        ))
        .forEach(movement => {
          const key = norm(movement.codigo);
          const bottle = currentBottle(movement);
          const row = map.get(key) || {
            nome: movement.nome,
            codigo: movement.codigo,
            formula: movement.formula || bottle?.formula || '',
            total: 0,
            unidade: movement.unidade || 'g'
          };

          row.total += n(movement.quantidadeGasta);
          map.set(key, row);
        });

      return [...map.values()]
        .sort((a, b) => b.total - a.total)
        .slice(0, 10);
    }

    function csvValue(value) {
      return `"${String(value ?? '').replaceAll('"', '""')}"`;
    }

    function download(content, name, type = 'text/csv;charset=utf-8') {
      const blob = new Blob(['\ufeff', content], { type });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');

      link.href = url;
      link.download = name;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    function rowsCSV(rows, columns) {
      const headerRow = columns.map(column => csvValue(column[0])).join(';');

      const dataRows = rows.map(row => (
        columns.map(([, key]) => {
          const value = key.toLowerCase().includes('data')
            ? dateTime(row[key])
            : row[key];

          return csvValue(value);
        }).join(';')
      )).join('\n');

      return `${headerRow}\n${dataRows}`;
    }

    function exportHistoryCSV() {

              <code>observacaoDevolucao</code> guarda a observação opcional informada no momento da devolução.
            </div>
          </div>
        `;

        return;
      }

      wrap.innerHTML = `

    function setPin() {
      const pin = prompt('Escolha um PIN de 4 a 6 dígitos:');
      if (pin === null) return;

      if (!/^\d{4,6}$/.test(pin)) {
        toast('Use de 4 a 6 dígitos.', true);
        return;
      }

      if (prompt('Digite o PIN novamente:') !== pin) {
        toast('Os PINs não coincidem.', true);
        return;
      }

      localStorage.setItem(PIN_KEY, pin);
      toast('PIN definido.');
      render();
    }

    function changePin() {
      if (verifyPin()) {
        setPin();
      }
    }

    function removePin() {
      if (!verifyPin()) return;

      localStorage.removeItem(PIN_KEY);
      toast('PIN removido.');
      render();
    }

    function exportBackup() {
      const exportedAt = new Date().toISOString();
      const fileName = `backup_almoxarifado_${todayInput()}.json`;

      state.lastBackup = exportedAt;
      state.logs.unshift({
        id: uid('log'),
        type: 'backup',
        description: `Backup exportado: ${fileName}`,
        date: exportedAt
      });
      save();

      const backup = {
        ...state,
        movements: state.movements.map(movement => {
          const { densidade, tara, ...cleanMovement } = movement;
          return cleanMovement;
        })
      };

      download(
        JSON.stringify(backup, null, 2),
        fileName,
        'application/json'
      );

      toast('Backup exportado.');
    }

    document.getElementById('backupInput').addEventListener('change', event => {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();

      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          const hasBottleCollection = Array.isArray(data.bottles)
            || Array.isArray(data.reagentes)
            || Array.isArray(data.pfBottles);
          const bottles = Array.isArray(data.bottles)
            ? data.bottles
            : (Array.isArray(data.reagentes) ? data.reagentes : []);
          const legacyPF = Array.isArray(data.pfBottles) ? data.pfBottles : [];
          const movements = Array.isArray(data.movements)
            ? data.movements
            : (Array.isArray(data.emprestimos) ? data.emprestimos : null);

          if (!hasBottleCollection || !movements) {
            throw new Error('Formato inválido');
          }

          if (
            !confirm('Substituir todos os dados atuais por este backup?')
            || !verifyPin()
          ) {
            return;
          }

          const importedAt = new Date().toISOString();

          state = normalizeState({
            ...data,
            bottles: [...bottles, ...legacyPF],
            pfBottles: [],
            movements,
            logs: Array.isArray(data.logs)
              ? data.logs
              : (Array.isArray(data.log) ? data.log : []),
            sourceFile: {
              name: file.name,
              size: file.size,
              importedAt
            }
          });

          state.logs.unshift({
            id: uid('log'),
            type: 'importação',
            description: `Backup importado: ${file.name}`,
            date: importedAt
          });

          save();
          toast('Backup importado com sucesso.');
          go('dashboard');
        } catch (error) {
          console.error(error);
          toast('Arquivo de backup inválido.', true);
        }
      };

      reader.readAsText(file);
      event.target.value = '';
    });

    function restoreEmpty() {
      if (
        !confirm('Apagar todos os dados e restaurar o sistema vazio?')
        || !verifyPin()
      ) {
        return;
      }

      state = clone(EMPTY_STATE);
      save();
      toast('Sistema restaurado vazio.');
      go('dashboard');
    }

    document.addEventListener('keydown', handleShortcut);

    renderNav();
    render();
  </script>
