    async function setPin() {
      const pin = await customPrompt('Escolha um PIN de 4 a 6 dígitos:', {
        title: 'Definir PIN',
        confirmText: 'Continuar',
        inputType: 'password',
        inputPlaceholder: '4 a 6 dígitos',
        inputMaxLength: 6
      });

      if (pin === null) return;

      if (!/^\d{4,6}$/.test(pin)) {
        toast('Use de 4 a 6 dígitos.', true);
        return;
      }

      const repeated = await customPrompt('Digite o PIN novamente:', {
        title: 'Confirmar PIN',
        confirmText: 'Salvar PIN',
        inputType: 'password',
        inputMaxLength: 6
      });

      if (repeated !== pin) {
        toast('Os PINs não coincidem.', true);
        return;
      }

      localStorage.setItem(PIN_KEY, pin);
      toast('PIN definido.');
      showSuccessAnimation('PIN definido', () => render());
    }

    async function changePin() {
      if (await verifyPin()) {
        await setPin();
      }
    }

    async function removePin() {
      if (!await verifyPin()) return;

      const confirmed = await customConfirm(
        'Deseja remover o PIN de segurança deste navegador?',
        { title: 'Remover PIN', confirmText: 'Remover' }
      );

      if (!confirmed) return;

      localStorage.removeItem(PIN_KEY);
      toast('PIN removido.');
      showSuccessAnimation('PIN removido', () => render());
    }

    function exportBackup() {
      showLoadingAnimation('Exportando backup...');

      setTimeout(() => {
        const exportedAt = new Date().toISOString();
      const fileName = `backup_almoxarifado_${todayInput()}.json`;

      state.lastBackup = exportedAt;
      state.logs.unshift({
        id: uid('log'),
        type: 'backup',
        description: `Backup exportado: ${fileName}`,
        date: exportedAt
      });
      save();

      const backup = {
        ...state,
        movements: state.movements.map(movement => {
          const { densidade, tara, ...cleanMovement } = movement;
          return cleanMovement;
        })
      };

      download(
        JSON.stringify(backup, null, 2),
        fileName,
        'application/json'
      );

        toast('Backup exportado.');
        hideActionAnimation();
      }, 520);
    }

    document.getElementById('backupInput').addEventListener('change', event => {
      const file = event.target.files[0];
      if (!file) return;

      showLoadingAnimation('Carregando backup...');
      const reader = new FileReader();

      reader.onload = async () => {
        try {
          const data = JSON.parse(reader.result);
          const hasBottleCollection = Array.isArray(data.bottles)
            || Array.isArray(data.reagentes)
            || Array.isArray(data.pfBottles);
          const bottles = Array.isArray(data.bottles)
            ? data.bottles
            : (Array.isArray(data.reagentes) ? data.reagentes : []);
          const legacyPF = Array.isArray(data.pfBottles) ? data.pfBottles : [];
          const movements = Array.isArray(data.movements)
            ? data.movements
            : (Array.isArray(data.emprestimos) ? data.emprestimos : null);

          if (!hasBottleCollection || !movements) {
            throw new Error('Formato inválido');
          }

          hideActionAnimation();

          const confirmed = await customConfirm(
            'Substituir todos os dados atuais por este backup?',
            { title: 'Importar backup', confirmText: 'Substituir dados' }
          );

          if (!confirmed || !await verifyPin()) {
            return;
          }

          showLoadingAnimation('Importando backup...');

          const importedAt = new Date().toISOString();

          state = normalizeState({
            ...data,
            bottles: [...bottles, ...legacyPF],
            pfBottles: [],
            movements,
            logs: Array.isArray(data.logs)
              ? data.logs
              : (Array.isArray(data.log) ? data.log : []),
            sourceFile: {
              name: file.name,
              size: file.size,
              importedAt
            }
          });

          state.logs.unshift({
            id: uid('log'),
            type: 'importação',
            description: `Backup importado: ${file.name}`,
            date: importedAt
          });

          save();
          toast('Backup importado com sucesso.');

          showSuccessAnimation('Backup importado', () => {
            go('dashboard');
          });
        } catch (error) {
          console.error(error);
          hideActionAnimation();
          toast('Arquivo de backup inválido.', true);
        }
      };

      reader.onerror = () => {
        hideActionAnimation();
        toast('Não foi possível ler o arquivo de backup.', true);
      };

      reader.readAsText(file);
      event.target.value = '';
    });

    async function restoreEmpty() {
      const confirmed = await customConfirm(
        'Apagar todos os dados e restaurar o sistema vazio?\n\nEsta ação não pode ser desfeita sem um backup.',
        { title: 'Restaurar dados', confirmText: 'Apagar tudo', destructive: true }
      );

      if (!confirmed || !await verifyPin()) {
        return;
      }

      state = clone(EMPTY_STATE);
      save();
      toast('Sistema restaurado vazio.');

      showSuccessAnimation('Dados restaurados', () => {
        go('dashboard');
      });
    }

    document.addEventListener('keydown', handleShortcut);

    renderNav();
    render();
  </script>
